# Strict schedule ablation chained from ``default_densify15k.yaml``: keep
# every refinement setting fixed and change only the opacity-reset cadence to
# the 3,000-iteration schedule used by released ULF-Loc/STDLoc 2DGS.
type: '2dgs'
iterations: 7000
densify_until_iter: 15000
opacity_reset_interval: 3000
depth_ratio: 0.5
normal_consistency_from: 3500
distortion_from: 1500
use_mip_filter: true
