# Strict schedule ablation: identical to ``default.yaml`` except that opacity
# reset follows the 3,000-iteration cadence used by the released ULF-Loc and
# STDLoc 2DGS loops.
type: '2dgs'
iterations: 7000
densify_until_iter: 3500
opacity_reset_interval: 3000
depth_ratio: 0.5
normal_consistency_from: 3500
distortion_from: 1500
use_mip_filter: true
