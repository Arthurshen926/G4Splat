type: '2dgs'
# Historical 7k -> 40k continuation: this configuration keeps topology fixed
# after the screened structural map.  It does *not* allocate real-view
# residual Gaussians; use outdoor_protected_residual48k for the additive,
# baseline-preserving continuation stage.
iterations: 40000
densify_until_iter: 7000
opacity_reset_interval: 7000
opacity_cull: 0.005
depth_ratio: 0.5
normal_consistency_from: 3500
distortion_from: 1500
use_mip_filter: true
