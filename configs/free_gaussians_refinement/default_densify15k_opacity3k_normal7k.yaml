# Strict chained standard-protocol control: relative to
# ``default_densify15k_opacity3k.yaml``, delay native 2DGS normal consistency
# until iteration 7,000.  It is therefore inactive in a 7k screen, matching
# the released ULF-Loc/STDLoc activation schedule.
type: '2dgs'
iterations: 7000
densify_until_iter: 15000
opacity_reset_interval: 3000
depth_ratio: 0.5
normal_consistency_from: 7000
distortion_from: 1500
use_mip_filter: true
