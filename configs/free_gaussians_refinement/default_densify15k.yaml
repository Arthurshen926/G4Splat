# Strict capacity ablation: identical to ``default.yaml`` except that
# densification remains enabled through iteration 15,000.  Pair it with
# ``--iterations 30000`` to separate Gaussian capacity from all other
# regularization and optimization-schedule changes in ``long.yaml``.
type: '2dgs'
iterations: 7000
densify_until_iter: 15000
opacity_reset_interval: 1000
depth_ratio: 0.5
normal_consistency_from: 3500
distortion_from: 1500
use_mip_filter: true
